# Manual corrections and additions, applied after the adapters. Every entry needs a reason
# and a source URL; patches and added plans need an `expires` date (YYYY-MM-DD) after which
# they stop applying and the build report flags them for review.
#
# Remove a record:
#   [[exclude]]
#   id = "pentanet-elite"
#   reason = "Feed puts a speed figure in the price field"
#   source = "https://billhero.com.au/data/broadband"
#
# Change fields on a record (any schema field; nested tables replace the whole field):
#   [[patch]]
#   id = "telstra-premium-nbn"
#   set = { price = 115.0, verified = true }
#   reason = "Price checked on telstra.com.au"
#   source = "https://www.telstra.com.au/internet/plans"
#   expires = "2027-02-28"
#
# Add a plan no adapter covers (e.g. Starlink, 5G home), as a full record. Its `source` is set
# to "override"; put the page the facts came from in `source_url`. Leave out fields that are
# null (TOML has no null): tier, promo, data_gb, credit, network.
#   [[internet]]
#   id = "starlink-residential"
#   provider = "starlink"
#   ...all schema fields...
#   reason = "Prices read from Starlink's Critical Information Summary"
#   source_url = "https://starlink.com/legal/documents/..."
#   expires = "2027-01-31"

[[exclude]]
