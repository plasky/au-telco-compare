# Provider registry: canonical id -> display name and hints.
# Ids match Bill Hero's carrier slugs where possible. Unknown slugs fall back to a title-cased
# name and are listed in the build report so they can be added here.
#
# own_network = true: the provider sells on its own network (private fibre or fixed wireless),
# available only in particular estates or regions. Its plans are kind "private".
# mvno_of: host mobile network for budget brands (Bill Hero also supplies this per plan).

[providers]
"1st-energy" = { name = "1st Energy" }
activ8me = { name = "Activ8me" }
agl = { name = "AGL" }
